name: Build APK and GPU runtime packages
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gpu-runtime-build
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install native tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.2.12479018'
          sudo apt-get update && sudo apt-get install -y glslc
      - name: Build matching APK and GPU packages
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Upload matching build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: github-apk-and-gpu-runtime
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/gpuRuntime/release/gpu-arm64-v8a-*.so.gz
            app/build/outputs/gpuRuntime/release/gpu-x86_64-*.so.gz
          if-no-files-found: error
